syntax = "proto3";

package test_records;

// Simple person record for testing
message Person {
    int64 id = 1;
    string name = 2;
    string email = 3;
    int32 age = 4;
    string city = 5;
}

// Simple product record for testing
message Product {
    int64 id = 1;
    string name = 2;
    double price = 3;
    string category = 4;
    int32 stock = 5;
}

// Union message containing all record types
message RecordUnion {
    oneof record {
        Person person = 1;
        Product product = 2;
    }
}
