name: Feature request
description: Suggest a new feature or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: If the Java Record Layer has this feature, link to it.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
