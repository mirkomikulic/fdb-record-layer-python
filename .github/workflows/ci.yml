name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install ruff
        run: pip install "ruff>=0.17.6"

      - name: Check linting
        run: ruff check fdb_record_layer tests examples/quickstart.py

      - name: Check formatting
        run: ruff format --check fdb_record_layer tests examples/quickstart.py

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -e ".[dev,sql]"

      - name: Run mypy
        run: mypy fdb_record_layer

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev,sql]"

      - name: Run tests
        run: pytest tests -v --tb=short

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -e ".[dev,sql]"

      - name: Run tests with coverage
        run: pytest tests --cov=fdb_record_layer --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  integration-test:
    name: Integration (FDB ${{ matrix.fdb }})
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        # Client library, server and Python binding must share major.minor.
        include:
          - fdb: "7.4.10"
            binding: "foundationdb~=7.4.0"
          - fdb: "8.0.1"
            binding: "foundationdb~=8.0.0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install FDB client library ${{ matrix.fdb }}
        run: |
          wget -q https://github.com/apple/foundationdb/releases/download/${{ matrix.fdb }}/foundationdb-clients_${{ matrix.fdb }}-1_amd64.deb
          sudo dpkg -i foundationdb-clients_${{ matrix.fdb }}-1_amd64.deb

      - name: Install dependencies
        run: pip install -e ".[dev,sql]" "${{ matrix.binding }}"

      - name: Compile test protobufs
        run: |
          python -m grpc_tools.protoc \
            --python_out=tests/integration \
            --proto_path=tests/integration \
            tests/integration/test_records.proto

      - name: Start FDB ${{ matrix.fdb }}
        env:
          FDB_VERSION: ${{ matrix.fdb }}
        run: scripts/setup_fdb.sh

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short
        env:
          FDB_CLUSTER_FILE: ./fdb.cluster

      - name: Run README quick start
        run: python examples/quickstart.py
        env:
          FDB_CLUSTER_FILE: ./fdb.cluster

      - name: Run comprehensive example
        run: python examples/comprehensive_example.py
        env:
          FDB_CLUSTER_FILE: ./fdb.cluster

      - name: Stop FDB
        if: always()
        run: docker compose down -v || true

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install build tools
        run: pip install "build>=1.6.1" "twine>=7.0.0"

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
